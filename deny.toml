# cargo-deny configuration. Only the bans check is configured; run it with
# `cargo deny check bans`.
#
# Every skipped entry is an older copy of a crate that is pulled in by a
# third-party dependency we do not control (mostly age 0.11 on the RustCrypto
# 0.10 generation, the rand 0.8/0.9 split, and syn 2 vs 3). Direct duplicates
# that could be unified were unified; revisit this list when those crates move.

[bans]
multiple-versions = "deny"
wildcards = "allow"

skip = [
    { crate = "aead@0.5.2", reason = "age 0.11" },
    { crate = "hmac@0.12.1", reason = "age 0.11" },
    { crate = "base64@0.21.7", reason = "age, openidconnect" },
    { crate = "base64@0.22.1", reason = "axum, bollard, instant-acme, jsonwebtoken, cl-proxy" },
    { crate = "block-buffer@0.10.4", reason = "RustCrypto 0.10 generation (age, sha2 0.10)" },
    { crate = "chacha20@0.9.1", reason = "age 0.11" },
    { crate = "chacha20poly1305@0.10.1", reason = "age 0.11" },
    { crate = "cipher@0.4.4", reason = "age 0.11" },
    { crate = "const-oid@0.9.6", reason = "RustCrypto 0.10 generation" },
    { crate = "cpufeatures@0.2.17", reason = "RustCrypto 0.10 generation" },
    { crate = "crypto-common@0.1.6", reason = "RustCrypto 0.10 generation" },
    { crate = "curve25519-dalek@4.1.3", reason = "x25519-dalek 2 via age 0.11 (cl-secret uses x25519-dalek 3)" },
    { crate = "digest@0.10.7", reason = "RustCrypto 0.10 generation" },
    { crate = "getrandom@0.2.17", reason = "ring, rand 0.8" },
    { crate = "getrandom@0.3.4", reason = "rand 0.9 and others" },
    { crate = "inout@0.1.4", reason = "age 0.11" },
    { crate = "nom@7.1.3", reason = "age 0.11" },
    { crate = "pem@3.0.6", reason = "rcgen / third parties" },
    { crate = "poly1305@0.8.0", reason = "age 0.11" },
    { crate = "rand@0.8.8", reason = "cl-drive, age, third parties" },
    { crate = "rand@0.9.5", reason = "third parties" },
    { crate = "rand_chacha@0.3.1", reason = "rand 0.8" },
    { crate = "rand_core@0.6.4", reason = "rand 0.8" },
    { crate = "rand_core@0.9.5", reason = "rand 0.9" },
    { crate = "rustc-hash@1.1.0", reason = "third parties" },
    { crate = "sha2@0.10.9", reason = "age, third parties; cl-secret" },
    { crate = "syn@2.0.119", reason = "proc-macros not yet on syn 3" },
    { crate = "synstructure@0.13.2", reason = "tied to syn 2" },
    { crate = "thiserror@1.0.69", reason = "third parties" },
    { crate = "thiserror-impl@1.0.69", reason = "third parties" },
    { crate = "universal-hash@0.5.1", reason = "age 0.11" },
    { crate = "untrusted@0.7.1", reason = "third parties (rustls-webpki, ring)" },
    { crate = "webpki-roots@0.26.11", reason = "tokio-tungstenite 0.29" },
    { crate = "x25519-dalek@2.0.1", reason = "age 0.11" },
    { crate = "core-foundation@0.9.4", reason = "macOS-only; system-configuration vs rustls-platform-verifier" },
    { crate = "fiat-crypto@0.2.9", reason = "curve25519-dalek 4 via age 0.11" },
    { crate = "r-efi@5.3.0", reason = "UEFI-only; getrandom 0.3 vs 0.4" },
    { crate = "windows-sys@0.52.0", reason = "Windows-only; third parties on different generations" },
]
