name: release

# Pushes to master also run the build, and publish it as a pre-release. GitHub only
# lets a tag ref restore caches saved from the default branch, never from
# another tag, so master is what keeps the release-profile cache warm. Tag runs
# restore it and do not save.
on:
  push:
    branches: [master]
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # sccache's GitHub backend.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cc: ""
          - target: aarch64-unknown-linux-gnu
            cc: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: build the ui (embedded into the binary by rust-embed)
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref_type == 'branch' }}

      - name: install the aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      # .cargo/config.toml wires the host target to clang+mold and sets
      # [build] rustc-wrapper = "sccache" globally, so both targets need
      # sccache on PATH and the x86_64 leg needs mold too.
      - name: install mold
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: mozilla-actions/sccache-action@v0.0.7

      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cc }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.cc }}
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --target ${{ matrix.target }} -p clouduler

      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/clouduler dist/clouduler-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: clouduler-${{ matrix.target }}
          path: dist/clouduler-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: create the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # Every master push is published as a pre-release. The updater's
      # "latest" lookup skips pre-releases, so these are only picked up when
      # pinned by their tag url. The tag does not match v*, so creating it
      # does not start this workflow again.
      - name: create the pre-release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-${{ github.run_number }}-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: pre-release ${{ github.run_number }} (${{ github.sha }})
          prerelease: true
          files: dist/*
          generate_release_notes: true

      # Only the newest pre-release is kept: drop every earlier one and its tag.
      - name: delete the previous pre-releases
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: pre-${{ github.run_number }}-${{ github.sha }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isPrerelease --jq '.[] | select(.isPrerelease and (.tagName | startswith("pre-"))) | .tagName' |
          while read -r tag; do
            [ "$tag" = "$CURRENT" ] && continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
