name: release

# Pushes to master also run the build, and publish it as a pre-release. GitHub only
# lets a tag ref restore caches saved from the default branch, never from
# another tag, so master is what keeps the release-profile cache warm. Tag runs
# restore it and do not save.
on:
  push:
    branches: [master]
    tags:
      - "v*"
      # pre-release tags (v<version>-next-<sha>) must not start a release run
      - "!v*-next-*"

env:
  CARGO_TERM_COLOR: always
  # sccache's GitHub backend.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          # built natively on an arm runner: no cross toolchain to install
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: build the ui (embedded into the binary by rust-embed)
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref_type == 'branch' }}

      # .cargo/config.toml wires the host target to clang+mold and sets
      # [build] rustc-wrapper = "sccache" globally, so both targets need
      # sccache on PATH and the x86_64 leg needs mold too.
      - name: install mold
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          # IPv4 only, and let apt retry failed downloads itself
          printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y mold

      - uses: mozilla-actions/sccache-action@v0.0.7

      - name: build
        run: cargo build --release --target ${{ matrix.target }} -p clouduler

      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/clouduler dist/clouduler-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: clouduler-${{ matrix.target }}
          path: dist/clouduler-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: github.ref_type == 'branch'

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: create the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # Every master push is published as a pre-release. The updater's
      # "latest" lookup skips pre-releases, so these are only picked up when
      # pinned by their tag url (v<version>-next-<sha>). That tag matches v*,
      # so the tag filter at the top excludes it from starting this workflow.
      - name: name the pre-release
        if: github.ref_type == 'branch'
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "PRE_TAG=v${version}-next-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: create the pre-release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PRE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.PRE_TAG }}
          prerelease: true
          # The repo has immutable releases: assets can only be attached
          # while the release is still a draft, so publish it afterwards.
          draft: true
          files: dist/*
          generate_release_notes: true

      - name: publish the pre-release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$PRE_TAG" \
            --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

      # Only the newest pre-release is kept: drop every earlier one and its tag.
      - name: delete the previous pre-releases
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ env.PRE_TAG }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isPrerelease --jq '.[] | select(.isPrerelease and (.tagName | (startswith("pre-") or test("-next-")))) | .tagName' |
          while read -r tag; do
            [ "$tag" = "$CURRENT" ] && continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
