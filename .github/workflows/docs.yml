name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    # Debian image: playwright's --with-deps apt install runs against deb.debian.org
    # instead of the ubuntu mirrors whose DNS keeps failing on the runners.
    container: node:22-trixie
    steps:
      - run: |
          printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "5";\n' > /etc/apt/apt.conf.d/99ci
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm ci
        working-directory: docs
      - run: npm run setup:browsers -- --with-deps
        working-directory: docs
      - run: npm run build:full
        working-directory: docs
      - run: echo clouduler.liteapp.fr > docs/build/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
