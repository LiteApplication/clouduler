# Clouduler's own CI. For examples of using clouduler *from* your pipeline to
# deploy a stack, see examples/ci/.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # .cargo/config.toml wires the host target to clang+mold and sccache
      # for local build speed; CI needs the same tools on PATH.
      - run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@v0.0.7
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@v0.0.7
      - run: cargo build -p clouduler
      # The shipped examples have to stay valid, or the first thing a new user
      # copies is broken.
      - name: check the example configs
        run: |
          for cfg in examples/*.yaml; do
            echo "== $cfg"
            ./target/debug/clouduler --config "$cfg" check
          done

  # The qemu suite boots real VMs, so it is slower and kept off the pull
  # request and push paths entirely. It only runs when triggered manually
  # via workflow_dispatch.
  qemu:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The whole suite, and the runners often have no kvm, so every VM is
    # emulated. Locally with kvm the suite takes about twenty minutes; under
    # TCG it is several times that, and a timeout that kills a healthy run
    # looks exactly like a broken scenario.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # musl-tools gives build-binary.sh a musl-gcc, which is much faster than
      # its docker fallback. The guest rootfs is Alpine, so a glibc binary will
      # not start there.
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 musl-tools e2fsprogs
      # .cargo/config.toml sets [build] rustc-wrapper = "sccache" globally, so
      # build-binary.sh's cargo invocation needs sccache on PATH too.
      - uses: mozilla-actions/sccache-action@v0.0.7
      # GitHub's runners expose /dev/kvm on some images and not others. The
      # harness falls back to TCG on its own, which is slow but works.
      - run: sudo chmod 666 /dev/kvm || echo "no kvm, the suite will run under TCG"
      # The rootfs is built by running apk inside a user namespace with uid 0
      # mapped, which ubuntu 24.04 blocks by default through apparmor. Without
      # this the image build lays down nothing at all.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: cache the alpine base image
        uses: actions/cache@v4
        with:
          path: tests/qemu/cache
          key: qemu-rootfs-${{ hashFiles('tests/qemu/build-image.sh', 'tests/qemu/lib/guest-init.sh') }}

      - run: tests/qemu/build-image.sh
      # --all runs every scenario in tests/qemu/scenarios and reports one
      # summary at the end, so a failure names itself rather than hiding
      # behind whichever scenario the loop stopped on.
      - name: run every scenario
        run: tests/qemu/run.sh --all

      - name: keep the logs from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: tests/qemu/work/**/*.serial.log
          retention-days: 7
