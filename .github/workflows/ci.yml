# Clouduler's own CI. For examples of using clouduler *from* your pipeline to
# deploy a stack, see examples/ci/.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Nightly run, which is what drives the qemu smoke scenario below.
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  # sccache's GitHub backend.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.7
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The generated typescript bindings (ui/src/api/generated) are committed;
      # fail when they no longer match the rust types.
      - name: typescript bindings are up to date
        run: |
          scripts/gen-ts-bindings.sh
          test -z "$(git status --porcelain -- ui/src/api/generated)" || {
            git status --porcelain -- ui/src/api/generated
            echo "run scripts/gen-ts-bindings.sh and commit ui/src/api/generated"
            exit 1
          }
      # Regenerate the fixture, then fail if it differs from the committed
      # one. The ui typechecks against this file, so a backend shape change
      # that was not committed alongside it (and so never reached
      # ui/src/api/types.ts) is caught here rather than in production.
      - run: UPDATE_API_FIXTURES=1 cargo test -p cl-api api_shapes
      - name: fail on api-shapes.json drift
        run: |
          git diff --exit-code -- ui/src/api/__fixtures__/api-shapes.json || {
            echo "::error::api-shapes.json is stale: run UPDATE_API_FIXTURES=1 cargo test -p cl-api api_shapes, update ui/src/api/types.ts to match, and commit"
            exit 1
          }
      - run: cargo test --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: api-shapes-fixture
          path: ui/src/api/__fixtures__/api-shapes.json

  deny:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Advisories use the RustSec database fetched fresh on every run, so a
          # newly published advisory can fail this job without a code change.
          command: check bans advisories

  ui:
    needs: rust
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Overwrite the committed fixture with the one the rust job just
      # generated from a live backend, so the ui always typechecks against
      # what the backend actually returns on this commit.
      - uses: actions/download-artifact@v4
        with:
          name: api-shapes-fixture
          path: ui/src/api/__fixtures__
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  examples:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.7
      - run: cargo build -p clouduler
      # The shipped examples have to stay valid, or the first thing a new user
      # copies is broken.
      - name: check the example configs
        run: |
          for cfg in examples/*.yaml; do
            echo "== $cfg"
            ./target/debug/clouduler --config "$cfg" check
          done

  # The qemu suite boots real VMs, so it is slower and kept off the pull
  # request and push paths entirely. It runs the full suite when triggered
  # manually via workflow_dispatch, and only the formation smoke scenario on
  # the nightly schedule.
  qemu:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    # The whole suite, and the runners often have no kvm, so every VM is
    # emulated. Locally with kvm the suite takes about twenty minutes; under
    # TCG it is several times that, and a timeout that kills a healthy run
    # looks exactly like a broken scenario.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # musl-tools gives build-binary.sh a musl-gcc, which is much faster than
      # its docker fallback. The guest rootfs is Alpine, so a glibc binary will
      # not start there.
      - run: |
          # IPv4 only, and let apt retry failed downloads itself
          printf 'Acquire::ForceIPv4 "true";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99ci >/dev/null
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 musl-tools e2fsprogs
      # .cargo/config.toml sets [build] rustc-wrapper = "sccache" globally, so
      # build-binary.sh's cargo invocation needs sccache on PATH too.
      - uses: mozilla-actions/sccache-action@v0.0.7
      # GitHub's runners expose /dev/kvm on some images and not others. The
      # harness falls back to TCG on its own, which is slow but works.
      - run: sudo chmod 666 /dev/kvm || echo "no kvm, the suite will run under TCG"
      # The rootfs is built by running apk inside a user namespace with uid 0
      # mapped, which ubuntu 24.04 blocks by default through apparmor. Without
      # this the image build lays down nothing at all.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: cache the alpine base image
        uses: actions/cache@v4
        with:
          path: tests/qemu/cache
          key: qemu-rootfs-${{ hashFiles('tests/qemu/build-image.sh', 'tests/qemu/lib/guest-init.sh') }}

      - run: tests/qemu/build-image.sh
      # --all runs every scenario in tests/qemu/scenarios and reports one
      # summary at the end, so a failure names itself rather than hiding
      # behind whichever scenario the loop stopped on.
      - name: run every scenario
        if: github.event_name == 'workflow_dispatch'
        run: tests/qemu/run.sh --all

      - name: run the formation smoke scenario
        if: github.event_name == 'schedule'
        run: tests/qemu/run.sh formation

      - name: keep the logs from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: tests/qemu/work/**/*.serial.log
          retention-days: 7
