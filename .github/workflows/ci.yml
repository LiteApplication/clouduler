# Clouduler's own CI. For examples of using clouduler *from* your pipeline to
# deploy a stack, see examples/ci/.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p clouduler
      # The shipped examples have to stay valid, or the first thing a new user
      # copies is broken.
      - name: check the example configs
        run: |
          for cfg in examples/*.yaml; do
            echo "== $cfg"
            ./target/debug/clouduler --config "$cfg" check
          done

  # The qemu suite boots real VMs, so it is slower and kept off the pull request
  # path. It runs on pushes to the default branch and on demand.
  qemu:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # musl-tools gives build-binary.sh a musl-gcc, which is much faster than
      # its docker fallback. The guest rootfs is Alpine, so a glibc binary will
      # not start there.
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 musl-tools e2fsprogs
      # GitHub's runners expose /dev/kvm on some images and not others. The
      # harness falls back to TCG on its own, which is slow but works.
      - run: sudo chmod 666 /dev/kvm || echo "no kvm, the suite will run under TCG"

      - name: cache the alpine base image
        uses: actions/cache@v4
        with:
          path: tests/qemu/cache
          key: qemu-rootfs-${{ hashFiles('tests/qemu/build-image.sh', 'tests/qemu/lib/guest-init.sh') }}

      - run: tests/qemu/build-image.sh
      - run: tests/qemu/run.sh --all

      - name: keep the logs from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: tests/qemu/work/**/*.serial.log
          retention-days: 7
