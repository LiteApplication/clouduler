[package]
name = "cl-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cl-backup.workspace = true
cl-config.workspace = true
cl-docker.workspace = true
cl-drive.workspace = true
cl-net.workspace = true
cl-proxy.workspace = true
cl-raft.workspace = true
cl-restic.workspace = true
cl-sched.workspace = true
cl-secret.workspace = true
cl-update.workspace = true

reqwest.workspace = true

axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
base64.workspace = true
futures.workspace = true
openidconnect = "4"
rand = "0.10"
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
serde_yaml.workspace = true
sha2 = "0.11"
sysinfo = "0.39"
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip"] }
tracing.workspace = true
uuid.workspace = true

# Not in the pre-wired list; added here since only cl-api needs them.
async-stream = "0.3"
axum-server = { version = "0.7", features = ["tls-rustls"] }
bollard = "0.21"
cookie = "0.18"
humantime = "2"
humantime-serde.workspace = true
rust-embed = { version = "8", features = ["interpolate-folder-path", "mime-guess"] }
# For `git2::Oid` only, in `routes::git_backup` - the git2 IO itself all lives
# in `cl-backup`.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "ssh"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
openraft = { workspace = true }
http-body-util.workspace = true
