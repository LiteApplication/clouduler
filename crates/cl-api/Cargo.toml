[package]
name = "cl-api"
version = "0.18.1"
edition.workspace = true
license.workspace = true

[dependencies]
ts-rs = { workspace = true, optional = true }
parking_lot.workspace = true
cl-alert.workspace = true
cl-backup.workspace = true
cl-config.workspace = true
cl-docker.workspace = true
cl-drive.workspace = true
cl-net.workspace = true
cl-proxy.workspace = true
cl-raft.workspace = true
cl-restic.workspace = true
cl-sched.workspace = true
cl-secret.workspace = true
cl-update.workspace = true

reqwest.workspace = true

axum = { version = "0.8", features = ["macros", "ws"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
base64.workspace = true
aho-corasick = "1"
zeroize.workspace = true
futures.workspace = true
openidconnect.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
sysinfo = "0.39"
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# MCP server for AI clients: tool/resource protocol plus the streamable-http
# transport, mounted into the axum router by `mcp`.
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-streamable-http-server"] }

# Not in the pre-wired list; added here since only cl-api needs them.
async-stream.workspace = true
axum-server = { version = "0.7", features = ["tls-rustls"] }
bollard.workspace = true
cookie = "0.18"
humantime.workspace = true
jiff = "0.2"
url = "2"
humantime-serde.workspace = true
rust-embed = { version = "8", features = ["interpolate-folder-path", "mime-guess"] }
# For `git2::Oid` only, in `routes::git_backup` - the git2 IO itself all lives
# in `cl-backup`.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "ssh"] }

[features]
# Derive TypeScript bindings for the wire types (see docs/content/contributing/typescript-bindings).
ts = ["dep:ts-rs", "cl-alert/ts", "cl-backup/ts", "cl-config/ts", "cl-raft/ts", "cl-restic/ts", "cl-sched/ts"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
tempfile.workspace = true
openraft = { workspace = true }
http-body-util.workspace = true
