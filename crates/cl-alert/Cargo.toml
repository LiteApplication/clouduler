[package]
name = "cl-alert"
version = "0.20.5"
edition.workspace = true
license.workspace = true

[dependencies]
ts-rs = { workspace = true, optional = true }
cl-config.workspace = true
humantime-serde.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "tokio1", "hostname", "pool"] }
rust-embed = { version = "8", features = ["mime-guess"] }

[features]
# Derive TypeScript bindings for the wire types (see docs/content/contributing/typescript-bindings).
ts = ["dep:ts-rs", "cl-config/ts"]
