<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{TITLE_TEXT}}</title>
</head>
<body style="margin:0;padding:0;background:#fff4df;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#fff4df;font-size:1px;line-height:1px;">{{PREHEADER}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fff4df;">
<tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
    <tr><td style="background:#150f1f;border:1px solid #3a2f57;border-radius:16px 16px 0 0;padding:16px 24px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr>
        {{LOGO}}
        <td style="font-family:'Bricolage Grotesque','Hanken Grotesk',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;font-weight:800;letter-spacing:-0.01em;color:#f6f0ff;">Clouduler</td>
        <td align="right" style="font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#b9acd6;">{{CLUSTER}}</td>
      </tr></table>
    </td></tr>
    <tr><td style="height:4px;line-height:4px;font-size:0;background:#ff5cae;">&nbsp;</td></tr>
    <tr><td style="background:#fffdf8;border-left:1px solid #e6d5b3;border-right:1px solid #e6d5b3;padding:28px 24px 24px 24px;font-family:'Hanken Grotesk',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1d1230;">
      {{BODY}}
    </td></tr>
    <tr><td style="background:#f6e8cc;border:1px solid #e6d5b3;border-radius:0 0 16px 16px;padding:14px 24px;font-family:'Hanken Grotesk',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#5a4c73;">
      {{FOOTER}}
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
