[package]
name = "cl-backup"
version = "0.13.0"
edition.workspace = true
license.workspace = true

[dependencies]
ts-rs = { workspace = true, optional = true }
parking_lot.workspace = true
age.workspace = true
base64.workspace = true
cl-raft.workspace = true
cl-secret.workspace = true
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "ssh"] }
serde.workspace = true
serde_json.workspace = true
ssh-key = { version = "0.6", features = ["ed25519", "std", "alloc"] }
thiserror.workspace = true
tracing.workspace = true

[features]
# Derive TypeScript bindings for the wire types (see docs/content/contributing/typescript-bindings).
ts = ["dep:ts-rs", "cl-raft/ts"]

[dev-dependencies]
tempfile.workspace = true
