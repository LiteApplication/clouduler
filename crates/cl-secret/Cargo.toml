[package]
name = "cl-secret"
version = "0.18.0"
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
hex.workspace = true
hmac.workspace = true
rand.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "io-util", "time"] }
