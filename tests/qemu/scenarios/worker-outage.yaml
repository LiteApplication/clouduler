# Worker outage and automatic redeployment: kill a worker running
# containers, confirm the leader marks it unreachable and reschedules its
# work, then bring it back and confirm it rejoins without duplicates.
name: worker-outage
description: kill a worker, watch reschedule after node_timeout, rejoin without duplicates.

# node_timeout=12s here (see failover overrides below) so the 30s default
# from docs/failover.md doesn't make this test needlessly slow.
nodes:
  - { name: n1, role: manager, ip: 10.10.0.1 }
  - { name: n2, role: manager, ip: 10.10.0.2 }
  - { name: n3, role: manager, ip: 10.10.0.3 }
  - { name: n4, role: worker,  ip: 10.10.0.4 }
  - { name: n5, role: worker,  ip: 10.10.0.5 }

failover:
  probe_interval: 2s
  fence_timeout: 6s
  node_timeout: 12s

steps:
  - wait_quorum: { timeout: 40 }
  - deploy_stack: { file: stacks/simple.yaml, name: simple }
  - wait_running: { stack: simple, service: app, timeout: 90 }
  - kill_service_node: { service: app, save_as: victim }
  - assert_unreachable: "${victim}"
  - assert_rescheduled: { service: app, not_on: "${victim}", timeout: 30 }
  - start_node: "${victim}"
  - assert_reachable: "${victim}"
  - assert_no_duplicate: { service: app }
