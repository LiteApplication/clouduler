# Config and secret propagation: deploy a stack carrying a config and a
# secret, confirm both reach every manager's database, that the secret is
# ciphertext (never returned by the api), and a node without the cluster
# key cannot accept a new secret.
name: config-secret-propagation
description: config and secret reach every manager, secret never leaves as plaintext.

nodes:
  - { name: n1, role: manager, ip: 10.10.0.1 }
  - { name: n2, role: manager, ip: 10.10.0.2 }
  - { name: n3, role: manager, ip: 10.10.0.3 }

steps:
  - wait_quorum: { timeout: 40 }
  - deploy_stack: { file: stacks/secretcfg.yaml, name: secretcfg }
  - wait_running: { stack: secretcfg, service: app, timeout: 30 }
  - assert_config_on_all_managers: { config: app-conf }
  - assert_secret_ciphertext: { node: n1, secret: db-pass }
