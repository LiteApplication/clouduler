# A container on an egress network gets its outbound traffic forced out the
# named host interface and nowhere else. n1 gets a second, isolated netdev
# (eth2) standing in for a VPN tunnel and is the only node with an address on
# the `vpn` egress network in cluster.yaml; n3 gets the same segment and a
# fixed-response canary listener reachable only over it.
#
# The deployed stack's container polls that canary and reports the result on
# a published port, so this reuses assert_published_port for both checks:
# reachable while the link is up (proves traffic actually left through the
# interface, not some other path), unreachable once it's down (proves the
# kill-switch, not a fallback route).
name: egress-network
description: an egress network's traffic only ever leaves through its named interface, and stops when that interface goes down.

nodes:
  - { name: n1, role: manager, ip: 10.10.0.1 }
  - { name: n2, role: manager, ip: 10.10.0.2 }
  - { name: n3, role: manager, ip: 10.10.0.3 }

vpn_segment:
  network: vpn
  egress_node: n1
  canary_node: n3

steps:
  - wait_quorum: { timeout: 40 }
  - deploy_stack: { file: stacks/egress-check.yaml, name: egress-check }
  - wait_running: { stack: egress-check, service: egress-check, timeout: 120 }
  - assert_published_port: { contains: canary-ok, timeout: 90 }
  - vpn_down: n1
  - assert_published_port: { contains: canary-blocked, timeout: 60 }
  - vpn_up: n1
  - assert_published_port: { contains: canary-ok, timeout: 90 }
