# Everything a stack can publish, in one place: an http route through the
# reverse proxy, a raw published port, and a second service that proves the
# internal resolver works by reaching the first one by name.
version: "3.8"

networks:
  cluster: {}

services:
  web:
    image: nginx:1.27-alpine
    restart: always
    networks: [cluster]
    x-clouduler:
      proxy:
        # A bare label, so wan's domain is appended and the route ends up as
        # app.wan.test. Plain http, because the test asserts against the
        # proxy's routing, not against a certificate it has no way to have
        # been issued. `wan` (a public network, no subnet) rather than
        # `cluster` (internal, subnetted): the proxy's network gating
        # (docs/proxy.md) only accepts a TCP peer inside a subnetted
        # network's range, and the harness asserts this route from the host
        # over a hostfwd port that arrives outside "cluster"'s subnet — the
        # same reason a real deployment would publish this externally on a
        # public network rather than the internal one.
        - host: app
          network: wan
          port: 80
          tls: false
      expose:
        - port: 80
          published: 2222
          protocol: tcp
          network: cluster

  probe:
    image: alpine:3.20
    restart: always
    networks: [cluster]
    command: ["sh", "-c", "while true; do sleep 5; done"]
    # The assertion the host cannot make itself: this only passes if the
    # container's resolver answers web.publish and the overlay carries the
    # request to it.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O - http://web.publish/ > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
