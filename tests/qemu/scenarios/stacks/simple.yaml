# Minimal stateless-ish service used by most scenarios: one replica of a
# tiny image on the test cluster network, no drive requirement so it can
# land on any node.
version: "3.8"

networks:
  cluster: {}

services:
  app:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do echo alive; sleep 5; done"]
    restart: always
    networks: [cluster]
    deploy:
      # Pinned to a worker so the outage scenarios kill a worker rather than
      # whichever node the scheduler happened to pick, which is usually a
      # manager and makes worker-outage a leader-failover test by accident.
      placement:
        constraints: ["node.role == worker"]
