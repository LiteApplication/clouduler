# Stack carrying a config and a secret. Compose has no per-service configs:/
# secrets: keys in clouduler yet (see docs/stacks.md), so this exercises the
# storage and propagation path: the files travel with the stack into the
# database on every manager, and the secret never leaves as plaintext.
version: "3.8"

networks:
  cluster: {}

configs:
  app-conf:
    file: app.conf

secrets:
  db-pass:
    file: db-pass.txt

services:
  app:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do echo alive; sleep 5; done"]
    restart: always
    networks: [cluster]
