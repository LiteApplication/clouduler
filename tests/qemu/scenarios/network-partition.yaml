# Network partition: split so a minority is isolated. The minority fences
# itself, the majority keeps serving, and after healing state converges with
# no split-brain.
name: network-partition
description: isolate a minority manager, majority keeps serving, heals with no split-brain.

nodes:
  - { name: n1, role: manager, ip: 10.10.0.1 }
  - { name: n2, role: manager, ip: 10.10.0.2 }
  - { name: n3, role: manager, ip: 10.10.0.3 }
  - { name: n4, role: worker,  ip: 10.10.0.4 }

failover:
  probe_interval: 2s
  fence_timeout: 6s
  node_timeout: 12s

steps:
  - wait_quorum: { timeout: 40 }
  - deploy_stack: { file: stacks/simple.yaml, name: simple }
  - wait_running: { stack: simple, service: app, timeout: 90 }
  - partition: [n3]
  - assert_fenced: [n3]
  - wait_running: { stack: simple, service: app, timeout: 90 }
  - heal: [n3]
  - assert_reachable: n3
  - assert_converged: { timeout: 30 }
