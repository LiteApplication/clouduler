# Quorum loss and fencing: kill two of three managers, confirm the lone
# survivor stops its containers within fence_timeout and starts nothing new,
# then restore quorum and confirm containers come back.
name: quorum-loss-fencing
description: kill 2 of 3 managers, survivor fences within fence_timeout, recovers when quorum returns.

nodes:
  - { name: n1, role: manager, ip: 10.10.0.1 }
  - { name: n2, role: manager, ip: 10.10.0.2 }
  - { name: n3, role: manager, ip: 10.10.0.3 }
  - { name: n4, role: worker,  ip: 10.10.0.4 }

failover:
  probe_interval: 2s
  fence_timeout: 6s
  node_timeout: 12s

steps:
  - wait_quorum: { timeout: 40 }
  - deploy_stack: { file: stacks/simple.yaml, name: simple }
  - wait_running: { stack: simple, service: app, timeout: 90 }
  - kill_node: n1
  - kill_node: n2
  - assert_fenced: [n3, n4]
  - assert_no_new_starts: { service: app, timeout: 8 }
  - start_node: n1
  - start_node: n2
  - wait_quorum: { timeout: 30 }
  - wait_running: { stack: simple, service: app, timeout: 90 }
