# Manager outage with quorum kept: kill one of three managers, confirm the
# cluster keeps working and a new leader is elected if the leader was the
# one killed.
name: manager-outage
description: kill one manager of three, cluster keeps serving, leader re-elects if needed.

nodes:
  - { name: n1, role: manager, ip: 10.10.0.1 }
  - { name: n2, role: manager, ip: 10.10.0.2 }
  - { name: n3, role: manager, ip: 10.10.0.3 }
  - { name: n4, role: worker,  ip: 10.10.0.4 }

failover:
  probe_interval: 2s
  fence_timeout: 6s
  node_timeout: 12s

steps:
  - wait_quorum: { timeout: 40 }
  - deploy_stack: { file: stacks/simple.yaml, name: simple }
  - wait_running: { stack: simple, service: app, timeout: 90 }
  - kill_leader: { save_as: victim }
  - assert_leader_elected: { timeout: 30 }
  - wait_running: { stack: simple, service: app, timeout: 90 }
