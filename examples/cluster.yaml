# Reference cluster config. Every key clouduler understands is shown here.
cluster:
  name: home

networks:
  # Internal networks carry node to node traffic and the container overlay.
  # The subnet must contain every node address on it. A domain is optional; when
  # set, records for it resolve to addresses on this network instead of public ones.
  # Internal implies private. Exactly one internal network is required.
  tailscale:
    type: internal
    subnet: 10.10.0.0/24
    domain: int.example.com

  # Further private networks a node may sit on. Same addressing rules as
  # internal, but they carry no cluster traffic.
  lan:
    type: private
    subnet: 192.168.1.0/24
    domain: lan.example.com

  # Public networks have no subnet. Records for their domain resolve to the
  # public address of the node running the service.
  wan:
    type: public
    domain: example.com

  # Not addressable, no subnet or domain: a service on this network gets its
  # outbound traffic forced out the named host interface (a VPN tunnel,
  # usually) on whichever node runs it, and nowhere else. See
  # docs/networking.md's "Egress networks" section. Clouduler does not bring
  # the interface up itself; n1's wg0 below is expected to already exist.
  vpn:
    type: egress

# Cluster wide directory namespaces. Volumes live inside a drive.
drives:
  fast:
    sync_interval: 5m
  bulk:
    sync_interval: 1h

nodes:
  n1:
    role: manager
    # Subnetted networks take a bare IP, public networks take an address block.
    network:
      tailscale: 10.10.0.1
      lan: 192.168.1.1
      wan:
        ipv4: 203.0.113.5 # will use A
        ipv6: "2001:db8::5" # will use AAAA
      # A bare non-IP string on an egress network names the host interface a
      # service on it egresses through. Only nodes with an address here
      # implement the network; the scheduler restricts such a service to them.
      vpn: wg0
    # Drives this node implements, mapped to the local directory backing them.
    drives:
      fast: /srv/clouduler/fast
      bulk: /srv/clouduler/bulk
  n2:
    role: manager
    network:
      tailscale: 10.10.0.2
      lan: 192.168.1.2
      wan:
        domain: n2.example.net # will use CNAME
    drives:
      fast: /srv/clouduler/fast
  n3:
    role: worker
    network:
      tailscale: 10.10.0.3 # will use A
    rpc_port: 7373
    drives:
      bulk: /mnt/bulk
    # Where this node keeps its database and working files, overriding the
    # cluster wide data_dir below. For a node whose big disk is elsewhere.
    data_dir: /mnt/bulk/clouduler
    # Overrides secrets.generate_if_missing for this node only. false means
    # this node may never create a cluster key, it can only be given one.
    # `clouduler init --join` sets this on every node that joins an existing
    # cluster: a second key would seal secrets nothing else can open.
    generate_secret_key: false

# For the clouduler web ui
web:
  # A bare label gets the network domain appended, so this is cloud.int.example.com.
  # A name containing a dot is used as is.
  address: cloud
  # Picks which node address the record points at.
  network: tailscale
  # Not 443: the reverse proxy below owns the standard ports, since that is
  # where the stacks you deploy are published. Refused if it collides with
  # either proxy port.
  port: 8443
  # Also publish the dashboard through the reverse proxy, so it picks up the
  # Let's Encrypt certificate and the Cloudflare record like any other route.
  # The direct listener on `port` above stays up either way; it is the way
  # back in if the proxy cannot bind its ports.
  through_proxy: true
  # Loopback port the proxy forwards dashboard traffic to. Never bound on a
  # real interface: that hop is plain HTTP and carries session cookies.
  backend_port: 8444

# What happens when a node drops out of the cluster.
#
# The two timeouts work against each other. fence_timeout must be shorter than
# node_timeout: the failing node has to stop its containers before anyone else
# starts them, or the same volume gets two writers. The config is rejected if
# that ordering is broken.
failover:
  # How long a node may be unreachable before its containers are rescheduled.
  node_timeout: 30s
  # How long a node may run without a manager quorum before it stops its own
  # containers.
  fence_timeout: 15s
  # How often the leader probes the other nodes.
  probe_interval: 5s

cloudflare:
  # The api token itself is set from the web ui and stored as a replicated
  # cluster secret, not here.
  zones:
    - example.com

# The reverse proxy in front of every x-clouduler.proxy route. Both listeners
# are bound on every node, because a route's hostname can resolve to any of
# them and the container behind it is reachable from all of them.
proxy:
  enabled: true
  http_port: 80
  https_port: 443
  acme:
    # Off by default: ordering certificates from a cluster the internet cannot
    # reach yet spends rate limit for nothing. Turn it on once the names in
    # your stacks resolve. Issuance is DNS-01 only, so it needs the cloudflare
    # section above.
    enabled: false
    # Left out for Let's Encrypt production. Point it at staging or a local
    # Pebble while you are still testing.
    directory_url: https://acme-staging-v02.api.letsencrypt.org/directory
    # Where the CA sends expiry warnings.
    contact_email: ops@example.com
