# Reference stack. Exercises the drive volume syntax, an HTTP proxy route and
# an `expose` entry for SSH. Validates against examples/cluster.yaml.
version: "3.8"

networks:
  wan: {}
  tailscale: {}

services:
  gitlab:
    image: gitlab/gitlab-ce:16.9.1-ce.0
    restart: unless-stopped
    networks: [wan, tailscale]
    environment:
      GITLAB_OMNIBUS_CONFIG: "external_url 'https://gitlab.example.com'"
    # drive/volume:/container/path, so data replicates and can migrate nodes
    volumes:
      - fast/gitlab-data:/var/opt/gitlab
      - fast/gitlab-config:/etc/gitlab
      - bulk/gitlab-logs:/var/log/gitlab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/-/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    x-clouduler:
      proxy:
        - host: gitlab
          network: wan
          port: 80
          tls: true
          middlewares: [redirect_https]
          # Reverse proxy behaviour for this route. All optional; each one
          # defaults to how the proxy behaved before it was configurable.
          #
          # Git pushes over HTTP send large packs, so the cap is generous.
          max_body_size: 2GiB
          # GitLab builds absolute URLs from the Host header.
          preserve_host: true
          # The web IDE and job log tailing are websockets.
          websockets: true
          # Generous: a big repo takes a while to start answering.
          response_timeout: 120s
      expose:
        - port: 22
          published: 2222
          protocol: tcp
          network: tailscale
      volume_sync:
        gitlab-data:
          interval: 5m
      auto_update: false
