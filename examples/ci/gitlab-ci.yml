# The same rollout on GitLab CI. Copy into .gitlab-ci.yml in your repository,
# alongside ci/deploy.sh from this repo.
#
# CI/CD variables to set (Settings -> CI/CD -> Variables), both masked:
#   CLOUDULER_URL     https://cloud.int.example.com
#   CLOUDULER_TOKEN   an admin api key made for CI
stages: [build, deploy]

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$IMAGE"
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy:
  stage: deploy
  image: alpine:3.20
  # The runner has to reach the cluster's web address. For a private network
  # that means a runner on it; a shared runner will not get there.
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - sed -i "s|IMAGE_TAG|$CI_COMMIT_SHA|" deploy/stack.yaml
    - ./ci/deploy.sh myapp deploy/stack.yaml
  variables:
    CLOUDULER_INSECURE: "1"
    DEPLOY_TIMEOUT: "180"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Nightly, for a service that follows a moving tag: no new stack file, just ask
# the cluster to re-resolve the image and restart if the digest moved.
refresh:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - ./ci/deploy.sh --update myapp web
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
